<title id="t">Client drone (generic quad), top view</title>
<desc id="d">Neutral line drawing of a generic analog FPV quadcopter seen from above: X-frame with four arms, a motor and propeller disc at each arm tip, central body with flight-controller stack, front camera and VTX antenna at the rear. Arrow marks the front. Not a specific model.</desc>
