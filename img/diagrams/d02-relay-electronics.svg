<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1626" width="400" height="1626" role="img" aria-labelledby="title desc" font-family="'Share Tech Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="14" fill="#e8e8e8">
<title id="title">D2 — Relay electronics block diagram: net/RC board, video board, KSZ8795 switch ports P1–P5, VLANs, power, LEDs</title>
<desc id="desc">VIN 6–26 V from the carrier battery bus (XT30) through fuse, reverse-polarity FET and TVS on the net/RC board, then the 3.3V_RC buck (switch, W5500, G0), the VBAT_TX buck (ELRS TX module) and VIN through the board-to-board connector to the video board. KSZ8795 switch: P1 HM30 air unit (transformer), P2 W5500 RC bridge (capacitor-coupled), P3 IP camera (JST-GH 4-pin), P4 spare (JST-GH 4-pin), P5 RMII to the N6. W5500 (UDP 5770) to STM32G030 bridge over SPI 32 MHz; G0 configures the switch over SPI and applies CAM_ENABLE to P3; G0 drives the ELRS TX module over single-wire CRSF at 400 kbaud (JST-GH VBAT_TX, GND, CRSF, spare). VLANs: P2 to P1 only; P3 and P4 to P1 (and P5 if needed). P1 egress priority: RC status, client video, camera. Video board: CVBS (SMA + JST-GH 2-pin) → TVP5150 / TW9900 → BT.656 → STM32N657 H.264, RTP to UDP 5600 → RMII P5. LEDs PG8 heartbeat, PG10 decoder lock, PG0 Ethernet link; bridge LEDs RC state and link, patterns TBD.</desc>
