     Token names below are the CSS custom properties without their two leading dashes (XML comments may not contain a double dash):
     #0f0f0f = bg · #171717 = surface · #1f1f1f = surface2 · #333333 = border2 · #6e6e6e = dim · #262626 = border
     #e8e8e8 = text · #a0a0a0 = muted · #f97316 = accent · #facc15 = amber · #ef4444 = red · #22c55e = green -->
<!-- Sources: plan §9.3 D10, §3.1, §4 S-02a, §6.1.6; manual Overview crew table, Crew Training; data/content.js checklist C (gs-mast, gs-mp-connect second screen via USB-C, gs-laptop-sleep). -->
