<text x="18" y="352" fill="#a0a0a0">Screen use per crew agreement.</text><text x="18" y="370" fill="#facc15">Power: mains where possible; never</text><text x="18" y="388" fill="#facc15">sleep / hibernate, lid: do nothing.</text><text x="18" y="406" fill="#facc15">App warns ON BATTERY / SAVER.</text>
