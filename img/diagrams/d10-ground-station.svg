<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 840" width="400" height="840" role="img" aria-labelledby="title desc" font-family="'Share Tech Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="14" fill="#e8e8e8">
<title id="title">D10 — Ground station layout: mast with HM30, GCS laptop and second screen, controller, crew positions, cables</title>
<desc id="desc">HM30 ground unit on the mast with a 6S 3000 mAh pack, Ethernet to the Windows GCS laptop (static IP). Screen A: Mission Planner (MAVLink UDPCI, never closed in flight). Screen B over USB-C: client video (viewer on UDP 5601 or the MP HUD on 5602) and the GCS app status bar; which screen shows what is agreed by the crew. The laptop runs on mains where possible and never sleeps or hibernates (lid action: do nothing); the app warns when on battery or battery saver. Carrier Pilot: Mission Planner as primary control, the 915 Nomad only as close-range backup. FPV Pilot: the EdgeTX radio on USB as a joystick with its RF modules off, flies the client through the app and watches video and alarms. Both pilots are co-located within speaking distance, direct verbal calls only. Positions and distances are per site.</desc>
