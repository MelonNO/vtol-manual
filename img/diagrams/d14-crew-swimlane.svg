<text x="16" y="134" font-weight="bold">1 · SETUP &amp; PRE-ARM</text>
<text x="18" y="164">power-up order</text>
<text x="18" y="183">MP connected</text>
<text x="18" y="202" fill="#22c55e" font-weight="bold">&quot;MP LIVE&quot;</text>
<text x="18" y="221">checklist</text>
<text x="18" y="240" fill="#22c55e" font-weight="bold">&quot;CHECKLIST GO&quot;</text>
<text x="18" y="259" fill="#22c55e" font-weight="bold">&quot;ARMING&quot;</text>
<text x="205" y="164">app normal start</text>
<text x="205" y="183">(arm DISARMED)</text>
<text x="205" y="202">bridge RUN, video</text>
<text x="205" y="221" fill="#f97316" font-weight="bold">&quot;FPV READY&quot;</text>
<text x="205" y="240" fill="#f97316" font-weight="bold">&quot;FPV GO&quot;</text>
<line x1="200" y1="146" x2="200" y2="264" stroke="#6e6e6e"/>
<rect x="8" y="276" width="384" height="26" fill="#1f1f1f" stroke="#6e6e6e"/>
<text x="16" y="294" font-weight="bold">2 · TAKEOFF &amp; TRANSITION</text>
<text x="18" y="324">QHOVER takeoff</text>
<text x="18" y="343" fill="#22c55e" font-weight="bold">&quot;TAKING OFF&quot;</text>
<text x="18" y="362">FBWB transition</text>
<text x="18" y="381" fill="#22c55e" font-weight="bold">&quot;TRANSITIONING&quot;</text>
<text x="18" y="400">no airspeed in 3 s</text>
<text x="18" y="419">→ QHOVER</text>
<text x="18" y="438" fill="#22c55e" font-weight="bold">&quot;TRANSITION FAIL&quot;</text>
<text x="205" y="324">monitors MP</text>
<text x="205" y="343" fill="#f97316" font-weight="bold">&quot;STABLE&quot;</text>
<text x="205" y="362" fill="#f97316" font-weight="bold">&quot;CLEAN TRANSITION&quot;</text>
<text x="205" y="381">advances WP1→WP2</text>
<text x="205" y="400" fill="#f97316" font-weight="bold">&quot;ADVANCING</text>
<text x="205" y="419" fill="#f97316" font-weight="bold"> WAYPOINT&quot;</text>
<text x="205" y="438" fill="#f97316" font-weight="bold">&quot;CARRIER ON STATION&quot;</text>
<line x1="200" y1="306" x2="200" y2="443" stroke="#6e6e6e"/>
<rect x="8" y="455" width="384" height="26" fill="#1f1f1f" stroke="#6e6e6e"/>
<text x="16" y="473" font-weight="bold">3 · RELAY OPERATIONS</text>
<text x="18" y="503">AUTO / GUIDED orbit,</text>
<text x="18" y="522">client on near side</text>
<text x="18" y="541">battery: at RTL V</text>
<text x="18" y="560" fill="#22c55e" font-weight="bold">&quot;CARRIER BATT —</text>
<text x="18" y="579" fill="#22c55e" font-weight="bold"> RTL SOON&quot;</text>
<text x="18" y="598">camera request</text>
<text x="18" y="617" fill="#22c55e" font-weight="bold">&quot;CAMERA ON / OFF&quot;</text>
<text x="205" y="503">flies the client</text>
<text x="205" y="522" fill="#f97316" font-weight="bold">&quot;FPV AIRBORNE&quot;</text>
<text x="205" y="541" fill="#f97316" font-weight="bold">&quot;RELAY SOLID&quot;</text>
<text x="205" y="560">app alarms →</text>
<text x="205" y="579" fill="#f97316" font-weight="bold">&quot;RC LINK DEGRADED&quot;</text>
<text x="205" y="598" fill="#f97316" font-weight="bold">&quot;FPV LINK WEAK&quot;</text>
<text x="205" y="617" fill="#f97316" font-weight="bold">&quot;BRIDGE FAILSAFE&quot;</text>
<text x="205" y="636" fill="#f97316" font-weight="bold">&quot;APP DOWN&quot;</text>
<text x="205" y="655" fill="#f97316" font-weight="bold">&quot;VIDEO SNOW&quot; /</text>
<text x="205" y="674" fill="#f97316" font-weight="bold">&quot;VIDEO DIGITAL LOST&quot;</text>
<text x="205" y="693" fill="#f97316" font-weight="bold">&quot;FPV BATT LOW —</text>
<text x="205" y="712" fill="#f97316" font-weight="bold"> RETURNING&quot;</text>
<line x1="200" y1="485" x2="200" y2="717" stroke="#6e6e6e"/>
<rect x="8" y="729" width="384" height="26" fill="#1f1f1f" stroke="#6e6e6e"/>
<text x="16" y="747" font-weight="bold">4 · RECOVERY</text>
<text x="18" y="777" fill="#22c55e" font-weight="bold">&quot;CARRIER RTL&quot;</text>
<text x="18" y="796" fill="#22c55e" font-weight="bold">&quot;BACK-</text>
<text x="18" y="815" fill="#22c55e" font-weight="bold"> TRANSITIONING&quot;</text>
<text x="18" y="834" fill="#22c55e" font-weight="bold">&quot;DESCENDING&quot;</text>
<text x="18" y="853" fill="#22c55e" font-weight="bold">&quot;LANDED&quot;</text>
<text x="18" y="872" fill="#22c55e" font-weight="bold">&quot;SAFE&quot;</text>
<text x="205" y="777">client home first</text>
<text x="205" y="796" fill="#f97316" font-weight="bold">&quot;FPV RETURNING&quot;</text>
<text x="205" y="815" fill="#f97316" font-weight="bold">&quot;FPV LANDED&quot;</text>
<text x="205" y="834">then assists in MP</text>
<text x="205" y="853" fill="#f97316" font-weight="bold">&quot;ZONE CLEAR&quot;</text>
<line x1="200" y1="759" x2="200" y2="877" stroke="#6e6e6e"/>
<rect x="18" y="889" width="364" height="68" rx="3" fill="#1f1f1f" stroke="#ef4444" stroke-width="2"/><text x="26" y="911" fill="#ef4444" font-weight="bold">EITHER PILOT: &quot;ABORT ABORT ABORT&quot;</text><text x="26" y="929">Carrier Pilot acts at once: QHOVER</text><text x="26" y="947">in VTOL phase, RTL in cruise.</text>
