     #e8e8e8 = text · #a0a0a0 = muted · #f97316 = accent · #facc15 = amber · #ef4444 = red · #22c55e = green -->
<!-- Sources: plan §9.3 D14, §6.1.9; manual Overview crew table, Procedures, Crew Training; data/content.js callouts (phrases verbatim). -->
