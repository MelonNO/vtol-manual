<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 993" width="400" height="993" role="img" aria-labelledby="title desc" font-family="'Share Tech Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="14" fill="#e8e8e8">
<title id="title">D14 — Crew swim-lane per phase: Carrier Pilot and FPV Pilot actions and callouts</title>
<desc id="desc">Setup and pre-arm: Carrier Pilot follows the power-up order, connects Mission Planner (&quot;MP LIVE&quot;), runs the checklist (&quot;CHECKLIST GO&quot;, &quot;ARMING&quot;); FPV Pilot does the app normal start with the arm switch DISARMED, checks bridge RUN and video (&quot;FPV READY&quot;, &quot;FPV GO&quot;). Takeoff and transition: Carrier Pilot takes off in QHOVER (&quot;TAKING OFF&quot;), transitions in FBWB (&quot;TRANSITIONING&quot;), reverts to QHOVER if airspeed has not built within 3 s (&quot;TRANSITION FAIL&quot;); FPV Pilot monitors MP (&quot;STABLE&quot;, &quot;CLEAN TRANSITION&quot;), advances WP1 to WP2 (&quot;ADVANCING WAYPOINT&quot;, &quot;CARRIER ON STATION&quot;). Relay operations: Carrier Pilot manages the orbit with the client on the near side, watches the battery (&quot;CARRIER BATT — RTL SOON&quot;) and requests the camera (&quot;CAMERA ON / OFF&quot;); FPV Pilot flies the client (&quot;FPV AIRBORNE&quot;, &quot;RELAY SOLID&quot;) and calls the app alarms (&quot;RC LINK DEGRADED&quot;, &quot;FPV LINK WEAK&quot;, &quot;BRIDGE FAILSAFE&quot;, &quot;APP DOWN&quot;, &quot;VIDEO SNOW&quot; or &quot;VIDEO DIGITAL LOST&quot;, &quot;FPV BATT LOW — RETURNING&quot;). Recovery: FPV Pilot brings the client home first (&quot;FPV RETURNING&quot;, &quot;FPV LANDED&quot;) and calls &quot;ZONE CLEAR&quot;; Carrier Pilot: &quot;CARRIER RTL&quot;, &quot;BACK-TRANSITIONING&quot;, &quot;DESCENDING&quot;, &quot;LANDED&quot;, &quot;SAFE&quot;. Either pilot may call &quot;ABORT ABORT ABORT&quot;.</desc>
