<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 840" width="400" height="840" role="img" aria-labelledby="title desc" font-family="'Share Tech Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="14" fill="#e8e8e8">
<title id="title">D5 — RC bridge (G0) state machine: BOOT, WAIT_GCS, START, RUN, FAILSAFE, with the CRSF output and LED pattern per state</title>
<desc id="desc">BOOT (no CRSF) → WAIT_GCS when the peripherals and the W5500 are up. WAIT_GCS (no CRSF) → START after 5 consecutive valid packets. START sends ModelID three times → RUN. RUN sends an RC frame on every scheduler tick → FAILSAFE when no valid packet arrives for T_hold (start value 250 ms). FAILSAFE is silent and returns immediately to WAIT_GCS. A valid packet has the right magic, version, CRC, source IP and an increasing sequence number. The watchdog (about 100 ms) resets the G0 to BOOT if the scheduler or the W5500 stops. LED pattern per state: TBD, to be defined by the bridge firmware. The GCS app shows UNREACHABLE when no bridge status arrives within 300 ms, which is normal before streaming.</desc>
<!-- Palette: standalone SVG cannot read the page CSS variables, so it uses the same values as the :root tokens in css/base.css.
     Token names below are the CSS custom properties without their two leading dashes (XML comments may not contain a double dash):
     #0f0f0f = bg · #171717 = surface · #1f1f1f = surface2 · #333333 = border2 · #6e6e6e = dim · #262626 = border
     #e8e8e8 = text · #a0a0a0 = muted · #f97316 = accent · #facc15 = amber · #ef4444 = red · #22c55e = green -->
<!-- Sources: plan §9.3 draft D5, §6.1.4; relay design &quot;Firmware architecture&quot; G0 state table and watchdog; contract C2 bridge.state; manual Pre-Arm bridge table. -->
<defs><marker id="ah-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f0f0f"/></marker><marker id="ah-surf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#171717"/></marker><marker id="ah-surf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="ah-border" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#262626"/></marker><marker id="ah-border2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ah-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8e8e8"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#facc15"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker><marker id="ah-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e6e"/></marker></defs>
<rect width="400" height="840" fill="#171717"/>
<text x="14" y="28" font-size="17" font-weight="bold">D5 · BRIDGE STATE MACHINE</text>
<text x="14" y="50" fill="#a0a0a0">G0 RC bridge · LED patterns TBD</text>
<rect x="18" y="72" width="300" height="70" rx="3" fill="#1f1f1f" stroke="#a0a0a0" stroke-width="2"/><text x="26" y="94" font-size="16" fill="#a0a0a0" font-weight="bold">BOOT</text><text x="26" y="114">CRSF: none</text><text x="26" y="134" fill="#a0a0a0">LED pattern: TBD (firmware)</text>
<polyline points="110,142 110,186" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-text)"/>
<text x="120" y="162">peripherals and W5500 up</text>
<rect x="18" y="188" width="300" height="70" rx="3" fill="#1f1f1f" stroke="#facc15" stroke-width="2"/><text x="26" y="210" font-size="16" fill="#facc15" font-weight="bold">WAIT_GCS</text><text x="26" y="230">CRSF: none</text><text x="26" y="250" fill="#a0a0a0">LED pattern: TBD (firmware)</text>
<polyline points="110,258 110,302" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-text)"/>
<text x="120" y="278">5 consecutive valid packets</text>
<rect x="18" y="304" width="300" height="70" rx="3" fill="#1f1f1f" stroke="#f97316" stroke-width="2"/><text x="26" y="326" font-size="16" fill="#f97316" font-weight="bold">START</text><text x="26" y="346">CRSF: ModelID × 3</text><text x="26" y="366" fill="#a0a0a0">LED pattern: TBD (firmware)</text>
<polyline points="110,374 110,418" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-text)"/>
<text x="120" y="394">ModelID sent × 3</text>
<rect x="18" y="420" width="300" height="70" rx="3" fill="#1f1f1f" stroke="#22c55e" stroke-width="2"/><text x="26" y="442" font-size="16" fill="#22c55e" font-weight="bold">RUN</text><text x="26" y="462">CRSF: RC frame every tick</text><text x="26" y="482" fill="#a0a0a0">LED pattern: TBD (firmware)</text>
<polyline points="110,490 110,534" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-text)"/>
<text x="120" y="510">no valid packet for T_hold</text>
<text x="120" y="528" fill="#a0a0a0">(start 250 ms)</text>
<rect x="18" y="536" width="300" height="70" rx="3" fill="#1f1f1f" stroke="#ef4444" stroke-width="2"/><text x="26" y="558" font-size="16" fill="#ef4444" font-weight="bold">FAILSAFE</text><text x="26" y="578">CRSF: none (silent)</text><text x="26" y="598" fill="#a0a0a0">LED pattern: TBD (firmware)</text>
<polyline points="318,571 360,571 360,223 320,223" fill="none" stroke="#ef4444" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-red)"/>
<text x="352" y="364" fill="#ef4444" text-anchor="end">immediately</text>
<text x="18" y="628">Valid packet: right magic, version,</text><text x="18" y="646">CRC, source IP, increasing seq.</text><text x="18" y="664" fill="#a0a0a0">Watchdog (IWDG, about 100 ms):</text><text x="18" y="682" fill="#a0a0a0">resets the G0 → BOOT if the scheduler</text><text x="18" y="700" fill="#a0a0a0">or the W5500 stops.</text>
<rect x="18" y="736" width="364" height="84" rx="3" fill="#1f1f1f" stroke="#6e6e6e" stroke-dasharray="5,4"/><text x="26" y="756" font-weight="bold">App-side state: UNREACHABLE</text><text x="26" y="774">no bridge status within 300 ms —</text><text x="26" y="792">normal before streaming: the bridge</text><text x="26" y="810">only answers a GCS that streams.</text>
</svg>
