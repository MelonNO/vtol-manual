<text x="18" y="288">Dashed white: last active line at</text><text x="18" y="306" fill="#facc15">18.4 ms. Dashed amber: last packet</text><text x="18" y="324" fill="#facc15">≤ 3 ms later (test 1 pass criterion).</text><text x="18" y="342" fill="#a0a0a0">Bar lengths of encode / send are</text><text x="18" y="360" fill="#a0a0a0">illustrative (estimates below).</text>
<text x="18" y="400" fill="#f97316" font-weight="bold">WHY THE RELAY ADDS ≈ 1 FIELD</text>
<text x="18" y="422">Each field is one H.264 picture. The</text><text x="18" y="440">top line waits for the whole field</text><text x="18" y="458">(18.4 ms PAL, 15.3 ms NTSC); every</text><text x="18" y="476">slice is encoded and sent as soon as</text><text x="18" y="494">it is complete, so only ≈ 3 ms more</text><text x="18" y="512">is added after the last line.</text><text x="18" y="530" font-weight="bold">Relay electronics ≈ 20 ms in total;</text><text x="18" y="548" fill="#a0a0a0">the HM30 (150–180 ms, estimate) and</text><text x="18" y="566" fill="#a0a0a0">the GCS (10–50 ms) dominate.</text>
<rect x="18" y="600" width="364" height="24" fill="#171717" stroke="#333333"/>
<text x="26" y="617" fill="#a0a0a0"></text>
<text x="140" y="617" font-weight="bold">PAL</text>
<text x="272" y="617" font-weight="bold">NTSC</text>
<rect x="18" y="624" width="364" height="24" fill="#1f1f1f" stroke="#333333"/>
<text x="26" y="641" fill="#a0a0a0">size</text>
<text x="140" y="641">704×288</text>
<text x="272" y="641">704×224*</text>
<rect x="18" y="648" width="364" height="24" fill="#1f1f1f" stroke="#333333"/>
<text x="26" y="665" fill="#a0a0a0">slices</text>
<text x="140" y="665">9 × 32 lines</text>
<text x="272" y="665">7</text>
<rect x="18" y="672" width="364" height="24" fill="#1f1f1f" stroke="#333333"/>
<text x="26" y="689" fill="#a0a0a0">field rate</text>
<text x="140" y="689">50 Hz</text>
<text x="272" y="689">59.94 Hz</text>
<rect x="18" y="696" width="364" height="24" fill="#1f1f1f" stroke="#333333"/>
<text x="26" y="713" fill="#a0a0a0">field time</text>
<text x="140" y="713">18.4 ms</text>
<text x="272" y="713">15.3 ms</text>
<text x="18" y="740" fill="#a0a0a0">* cropped, or 704×240 if 16-line</text><text x="18" y="758" fill="#a0a0a0">  slices work.</text><text x="18" y="776">Estimates: last slice encoded ≈ 0.5 ms;</text><text x="18" y="794">10–30 kB per field at 100 Mbit/s =</text><text x="18" y="812">0.8–2.4 ms. Picture starts in the</text><text x="18" y="830">vertical blanking (≈ 1.6 ms).</text><text x="18" y="848" fill="#facc15">No field for 25 ms → last field is</text><text x="18" y="866" fill="#facc15">re-sent; decoder lost &gt; 1 s → reset.</text>
