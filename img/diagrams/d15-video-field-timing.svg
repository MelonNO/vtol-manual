<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 894" width="400" height="894" role="img" aria-labelledby="title desc" font-family="'Share Tech Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="14" fill="#e8e8e8">
<title id="title">D15 — Video field timing: one PAL/NTSC field, its slices and packets, and why the relay adds about one field time</title>
<desc id="desc">A PAL field arrives over 18.4 ms (288 lines × 64 µs) as 9 slices of 32 lines (NTSC: 7 slices, 15.3 ms). The N6 encodes each slice as soon as it is complete (each slice must finish within 2 ms; the last slice about 0.5 ms, estimate) and sends RTP packets of at most 1400 bytes at once (10–30 kB per field at 100 Mbit/s = 0.8–2.4 ms). The last packet leaves at most 3 ms after the last active line (relay-design test 1). The top line waits for the whole field, so the relay adds about one field time; the relay electronics add about 20 ms in total, while the HM30 (about 150–180 ms, estimate) and the GCS (10–50 ms) dominate. PAL 704×288, 50 Hz; NTSC 704×224 cropped (or 704×240 with 16-line slices), 59.94 Hz. No field for 25 ms → the last field is re-sent; decoder lost for more than 1 s → reset.</desc>
