<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 994" width="400" height="994" role="img" aria-labelledby="title desc" font-family="'Share Tech Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="14" fill="#e8e8e8">
<title id="title">D4 — RC path timeline: controller, GCS app, HM30, bridge, CRSF slot, ELRS, client, with the latency of each stage</title>
<desc id="desc">1: USB controller to the GCS app, HID report, 1–8 ms (estimate). 2: the app sends a 36-byte rc_up to UDP 5770 every 4–5 ms (200–250 Hz, absolute deadlines). 3: HM30 uplink, unknown, measure with the UDP echo test. 4: switch P1 to P2, W5500 and G0 check magic, version, CRC, source IP and sequence and store the packet with a time stamp, under 1 ms (estimate). 5: wait for the next CRSF slot, up to one CRSF period (4–5 ms); the G0 locks its TIM2 to the ELRS timing frame 0x3A. 6: CRSF RC frame, 26 bytes at 400 kbaud, about 0.65 ms. 7: ELRS air packet to the client receiver and FC, one ELRS packet interval. The bridge returns a 10 Hz status (RTT from the echoed t_gcs_us) and forwarded CRSF telemetry. End-to-end latency TBD (measure).</desc>
<!-- Palette: standalone SVG cannot read the page CSS variables, so it uses the same values as :root in manual.html / index.html.
     Token names below are the CSS custom properties without their two leading dashes (XML comments may not contain a double dash):
     #0f0f0f = bg · #1a1a1a = surface · #222222 = surface2 · #333333 = border2 · #444444 = dim · #2a2a2a = border
     #e8e8e8 = text · #777777 = muted · #f97316 = accent · #facc15 = amber · #ef4444 = red · #22c55e = green -->
<!-- Sources: plan §9.3 draft D4; relay design &quot;Latency and link budget&quot; RC path table, &quot;Firmware architecture&quot; (G0 bridge). -->
<defs><marker id="ah-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f0f0f"/></marker><marker id="ah-surf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker><marker id="ah-surf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="ah-border" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a2a2a"/></marker><marker id="ah-border2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ah-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8e8e8"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#facc15"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker><marker id="ah-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
<rect width="400" height="994" fill="#1a1a1a"/>
<text x="14" y="28" font-size="17" fill="#f97316" font-weight="bold">D4 · RC PATH TIMELINE</text>
<text x="14" y="50" fill="#777777">Controller → client, latency per stage</text>
<rect x="18" y="70" width="364" height="73" rx="3" fill="#222222" stroke="#333333"/><text x="26" y="90" font-weight="bold">1 · USB controller → GCS app</text><text x="26" y="109">EdgeTX radio, HID report</text><text x="26" y="128" fill="#f97316" font-weight="bold">1–8 ms (estimate)</text>
<polyline points="200,143 200,165" fill="none" stroke="#f97316" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-accent)"/>
<rect x="18" y="167" width="364" height="92" rx="3" fill="#222222" stroke="#333333"/><text x="26" y="187" font-weight="bold">2 · GCS app sends rc_up</text><text x="26" y="206">36 B to UDP 5770, 200–250 Hz,</text><text x="26" y="225">on absolute deadlines</text><text x="26" y="244" fill="#f97316" font-weight="bold">every 4–5 ms</text>
<polyline points="200,259 200,281" fill="none" stroke="#f97316" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-accent)"/>
<text x="208" y="275" fill="#777777">HM30</text>
<rect x="18" y="283" width="364" height="73" rx="3" fill="#222222" stroke="#facc15"/><text x="26" y="303" font-weight="bold">3 · HM30 uplink</text><text x="26" y="322">radio link, ground → air</text><text x="26" y="341" fill="#facc15" font-weight="bold">unknown — measure (UDP echo)</text>
<polyline points="200,356 200,378" fill="none" stroke="#f97316" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-accent)"/>
<text x="208" y="372" fill="#777777">P1 → P2</text>
<rect x="18" y="380" width="364" height="92" rx="3" fill="#222222" stroke="#333333"/><text x="26" y="400" font-weight="bold">4 · Switch, W5500, G0</text><text x="26" y="419">check magic, version, CRC,</text><text x="26" y="438">source IP, seq; store with time</text><text x="26" y="457" fill="#f97316" font-weight="bold">under 1 ms (estimate)</text>
<polyline points="200,472 200,494" fill="none" stroke="#f97316" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-accent)"/>
<rect x="18" y="496" width="364" height="92" rx="3" fill="#222222" stroke="#333333"/><text x="26" y="516" font-weight="bold">5 · Wait for the next CRSF slot</text><text x="26" y="535">G0 TIM2 locked to the module's</text><text x="26" y="554">timing frame 0x3A (rate, offset)</text><text x="26" y="573" fill="#f97316" font-weight="bold">up to 1 CRSF period (4–5 ms)</text>
<polyline points="200,588 200,610" fill="none" stroke="#f97316" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-accent)"/>
<text x="208" y="604" fill="#777777">CRSF</text>
<rect x="18" y="612" width="364" height="73" rx="3" fill="#222222" stroke="#333333"/><text x="26" y="632" font-weight="bold">6 · CRSF RC frame to the module</text><text x="26" y="651">26 B at 400 kbaud, single wire</text><text x="26" y="670" fill="#f97316" font-weight="bold">about 0.65 ms</text>
<polyline points="200,685 200,707" fill="none" stroke="#f97316" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-accent)"/>
<text x="208" y="701" fill="#777777">ELRS RF</text>
<rect x="18" y="709" width="364" height="73" rx="3" fill="#222222" stroke="#f97316"/><text x="26" y="729" font-weight="bold">7 · ELRS air packet → client RX</text><text x="26" y="748">client RX → client FC</text><text x="26" y="767" fill="#f97316" font-weight="bold">1 ELRS packet interval</text>
<rect x="18" y="800" width="364" height="92" rx="3" fill="#222222" stroke="#22c55e"/><text x="26" y="820" fill="#22c55e" font-weight="bold">Back to the GCS app</text><text x="26" y="839">10 Hz status (echoed t_gcs_us →</text><text x="26" y="858">RTT) + forwarded CRSF telemetry</text><text x="26" y="877" fill="#22c55e" font-weight="bold">status / telemetry downlink</text>
<text x="18" y="916" fill="#facc15" font-weight="bold">End-to-end RC latency: TBD —</text><text x="18" y="934" fill="#facc15">measure (latency budget, RF &amp; Comms).</text><text x="18" y="952" fill="#777777">No valid packet for T_hold (start</text><text x="18" y="970" fill="#777777">250 ms) → bridge FAILSAFE (D5, D6).</text>
</svg>
