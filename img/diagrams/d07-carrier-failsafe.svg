<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1425" width="400" height="1425" role="img" aria-labelledby="title desc" font-family="'Share Tech Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="14" fill="#e8e8e8">
<title id="title">D7 — Carrier failsafe matrix and SIYI-loss timeline (replaces the old RC failsafe cascade)</title>
<desc id="desc">SIYI / Mission Planner link lost (primary): no GCS heartbeat for FS_LONG_TIMEOUT = 5 s in all modes (FS_GCS_ENABL = 2) → RTL in fixed-wing modes (FS_LONG_ACTN = 1), QRTL in VTOL modes (Q_OPTIONS bit 5, VERIFY in SITL); RTL ends with an automatic VTOL landing at home (Q_RTL_MODE = 2); pilot keeps the home landing zone clear, Nomad only within close range. 915 MHz backup lost: ELRS RX failsafe → no action, RC ignored (THR_FAILSAFE = 2); QHOVER holds with centred sticks and drifts with the wind; beyond close range no pilot action, close-in take over in Mission Planner (QLOITER / QLAND). Battery low 22.0 V (BATT_LOW_VOLT, 10 s below, sag-compensated voltage) → RTL (BATT_FS_LOW_ACT = 1) with an automatic VTOL landing at home; the pilot starts a manual RTL at 23.0 V first, and reselects QHOVER if it fires during a manual QHOVER landing. Battery critical 21.0 V (BATT_CRT_VOLT) → Loiter then QLand at the current position, not home (BATT_FS_CRT_ACT = 6); clear the area below. Transition fail: Q_TRANS_FAIL 8 s → Q_TRANS_FAIL_ACT = 1 → QRTL home, hover at 50 m REL and vertical landing at home; the pilot switches to QHOVER if airspeed has not built within 3 s and keeps the route WP2 → home clear. SIYI-loss timeline: 0 s heartbeat lost (client RC and video lost too, client fails safe, camera forced off); 5 s RTL in fixed-wing modes or QRTL in VTOL modes; RTL climbs to RTL_ALTITUDE 120 m REL, returns in fixed-wing and loiters down; airbrake approach and automatic VTOL landing at home — keep the home landing zone clear.</desc>
<!-- Palette: standalone SVG cannot read the page CSS variables, so it uses the same values as the :root tokens in css/base.css.
     Token names below are the CSS custom properties without their two leading dashes (XML comments may not contain a double dash):
     #0f0f0f = bg · #171717 = surface · #1f1f1f = surface2 · #333333 = border2 · #6e6e6e = dim · #262626 = border
     #e8e8e8 = text · #a0a0a0 = muted · #f97316 = accent · #facc15 = amber · #ef4444 = red · #22c55e = green -->
<!-- Sources: plan §15.1 / §15.2 (Rev C), §4 design intent (S-01, S-02, S-03), §9.2 row 1; reference param file docs/reference/carrier-params-2026-10-17.param; data/content.js failsafeTable; manual Flight Modes. -->
<defs><marker id="ah-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f0f0f"/></marker><marker id="ah-surf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#171717"/></marker><marker id="ah-surf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="ah-border" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#262626"/></marker><marker id="ah-border2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ah-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8e8e8"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0a0a0"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#facc15"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker><marker id="ah-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e6e"/></marker></defs>
<rect width="400" height="1425" fill="#171717"/>
<text x="14" y="28" font-size="17" font-weight="bold">D7 · CARRIER FAILSAFE</text>
<text x="14" y="50" fill="#a0a0a0">Link: SIYI loss only · battery</text>
<rect x="18" y="70" width="364" height="223" rx="3" fill="#1f1f1f" stroke="#ef4444" stroke-width="2.5"/><text x="26" y="91" font-size="15" fill="#ef4444" font-weight="bold">SIYI / MP LINK LOST — PRIMARY</text><text x="26" y="110">Detect:  no GCS heartbeat 5 s</text><text x="26" y="129">         (FS_LONG_TIMEOUT), all modes</text><text x="26" y="148">         (FS_GCS_ENABL = 2)</text><text x="26" y="167" fill="#ef4444" font-weight="bold">Carrier: FW modes: RTL (FS_LONG_ACTN)</text><text x="26" y="186" fill="#ef4444">         VTOL modes: QRTL (Q_OPTIONS</text><text x="26" y="205" fill="#facc15">         bit 5) — VERIFY in SITL</text><text x="26" y="224" fill="#ef4444">         RTL ends: auto VTOL landing</text><text x="26" y="243" fill="#ef4444">         at home (Q_RTL_MODE = 2)</text><text x="26" y="262" fill="#a0a0a0">Pilot:   keep the home LZ clear,</text><text x="26" y="281" fill="#a0a0a0">         Nomad only if close range</text>
<rect x="18" y="303" width="364" height="166" rx="3" fill="#1f1f1f" stroke="#a0a0a0" stroke-width="1"/><text x="26" y="324" font-size="15" fill="#a0a0a0" font-weight="bold">915 MHz BACKUP LOST</text><text x="26" y="343">Detect:  ELRS RX failsafe</text><text x="26" y="362" font-weight="bold">Carrier: NONE — RC ignored</text><text x="26" y="381">         (THR_FAILSAFE = 2); QHOVER</text><text x="26" y="400">         holds, drifts with the wind</text><text x="26" y="419" fill="#a0a0a0">Pilot:   none beyond close range;</text><text x="26" y="438" fill="#a0a0a0">         close-in: take over in MP</text><text x="26" y="457" fill="#a0a0a0">         (QLOITER / QLAND)</text>
<rect x="18" y="479" width="364" height="166" rx="3" fill="#1f1f1f" stroke="#facc15" stroke-width="1"/><text x="26" y="500" font-size="15" fill="#facc15" font-weight="bold">BATTERY LOW 22.0 V</text><text x="26" y="519">Detect:  BATT_LOW_VOLT, 10 s below</text><text x="26" y="538">         (sag-compensated voltage)</text><text x="26" y="557" fill="#facc15" font-weight="bold">Carrier: RTL (BATT_FS_LOW_ACT = 1),</text><text x="26" y="576" fill="#facc15">         auto VTOL landing at home</text><text x="26" y="595" fill="#a0a0a0">Pilot:   manual RTL at 23.0 V first;</text><text x="26" y="614" fill="#a0a0a0">         in a manual QHOVER landing:</text><text x="26" y="633" fill="#a0a0a0">         reselect QHOVER</text>
<rect x="18" y="655" width="364" height="128" rx="3" fill="#1f1f1f" stroke="#ef4444" stroke-width="1"/><text x="26" y="676" font-size="15" fill="#ef4444" font-weight="bold">BATTERY CRITICAL 21.0 V</text><text x="26" y="695">Detect:  BATT_CRT_VOLT</text><text x="26" y="714" fill="#ef4444" font-weight="bold">Carrier: Loiter → QLand HERE</text><text x="26" y="733" fill="#ef4444">         (BATT_FS_CRT_ACT = 6),</text><text x="26" y="752" fill="#ef4444">         not home</text><text x="26" y="771" fill="#a0a0a0">Pilot:   clear the area below</text>
<rect x="18" y="793" width="364" height="166" rx="3" fill="#1f1f1f" stroke="#facc15" stroke-width="1"/><text x="26" y="814" font-size="15" fill="#facc15" font-weight="bold">TRANSITION FAIL</text><text x="26" y="833">Detect:  Q_TRANS_FAIL 8 s</text><text x="26" y="852" fill="#facc15" font-weight="bold">Carrier: QRTL home (Q_TRANS_FAIL_ACT</text><text x="26" y="871" fill="#facc15">         = 1): hover at 50 m REL,</text><text x="26" y="890" fill="#facc15">         vertical landing at home</text><text x="26" y="909" fill="#a0a0a0">Pilot:   no airspeed in 3 s → QHOVER</text><text x="26" y="928" fill="#a0a0a0">         (faster than the timer);</text><text x="26" y="947" fill="#a0a0a0">         keep WP2 → home clear</text>
<text x="18" y="983" fill="#ef4444" font-weight="bold">SIYI-LOSS TIMELINE</text>
<circle cx="40" cy="1011" r="6" fill="#1f1f1f" stroke="#ef4444" stroke-width="2"/>
<line x1="40" y1="1017" x2="40" y2="1106" stroke="#ef4444" stroke-width="2"/>
<text x="56" y="1016" fill="#ef4444" font-weight="bold">0 s</text>
<text x="104" y="1016">GCS heartbeat lost (MP closed,</text><text x="104" y="1035">laptop asleep, cable, HM30).</text><text x="104" y="1054">Client RC + video lost too →</text><text x="104" y="1073">client fails safe; camera off.</text>
<circle cx="40" cy="1120" r="6" fill="#ef4444" stroke="#ef4444" stroke-width="2"/>
<line x1="40" y1="1126" x2="40" y2="1196" stroke="#ef4444" stroke-width="2"/>
<text x="56" y="1125" fill="#ef4444" font-weight="bold">5 s</text>
<text x="104" y="1125">any mode: RTL in FW modes,</text><text x="104" y="1144">QRTL in VTOL modes</text><text x="104" y="1163">(FS_LONG_ACTN = 1, Q_OPTIONS).</text>
<circle cx="40" cy="1210" r="6" fill="#1f1f1f" stroke="#ef4444" stroke-width="2"/>
<line x1="40" y1="1216" x2="40" y2="1286" stroke="#ef4444" stroke-width="2"/>
<text x="56" y="1215" fill="#ef4444" font-weight="bold">→</text>
<text x="104" y="1215">RTL: climb to RTL_ALTITUDE</text><text x="104" y="1234">120 m REL (above home), FW</text><text x="104" y="1253">return, loiter down.</text>
<circle cx="40" cy="1300" r="6" fill="#1f1f1f" stroke="#ef4444" stroke-width="2"/>
<text x="56" y="1305" fill="#ef4444" font-weight="bold">→</text>
<text x="104" y="1305">airbrake approach, automatic</text><text x="104" y="1324">VTOL landing at home</text><text x="104" y="1343" fill="#facc15">(Q_RTL_MODE = 2): keep the</text><text x="104" y="1362" fill="#facc15">home landing zone clear.</text>
<text x="18" y="1409" fill="#a0a0a0">Values: reference param file 2026-10-17.</text>
</svg>
