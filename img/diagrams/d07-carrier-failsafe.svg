<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1216" width="400" height="1216" role="img" aria-labelledby="title desc" font-family="'Share Tech Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="14" fill="#e8e8e8">
<title id="title">D7 — Carrier failsafe matrix and SIYI-loss timeline (replaces the old RC failsafe cascade)</title>
<desc id="desc">SIYI / Mission Planner link lost (primary): no GCS heartbeat for FS_LONG_TIMEOUT = 5 s in all modes (FS_GCS_ENABL = 2) → RTL (FS_LONG_ACTN = 1); Q-mode RTL behaviour TBD (SITL); pilot monitors, Nomad only within close range. 915 MHz backup lost: ELRS RX failsafe → no action, RC ignored (THR_FAILSAFE = 2); beyond close range no pilot action, close-in take over in Mission Planner (QLOITER / QLAND). Battery critical 22.2 V (BATT_CRT_VOLT) → Loiter then QLand at the current position; clear the area below. Battery low: BATT_LOW_VOLT = 0, not set, no action; manual RTL at 23.0 V, RTL active before the 22.5 V hard limit. Transition fail: Q_TRANS_FAIL 4 s → Q_TRANS_FAIL_ACT = 0 → QLand at the current position (VERIFY against the firmware); the pilot switches to QHOVER if airspeed has not built within 3 s. SIYI-loss timeline: 0 s heartbeat lost (client RC and video lost too, client fails safe, camera forced off); 5 s RTL in any mode; climb to RTL_ALTITUDE 120 m REL and return; back-transition and land per the Q settings (Q-mode behaviour TBD).</desc>
<!-- Palette: standalone SVG cannot read the page CSS variables, so it uses the same values as :root in manual.html / index.html.
     Token names below are the CSS custom properties without their two leading dashes (XML comments may not contain a double dash):
     #0f0f0f = bg · #1a1a1a = surface · #222222 = surface2 · #333333 = border2 · #444444 = dim · #2a2a2a = border
     #e8e8e8 = text · #777777 = muted · #f97316 = accent · #facc15 = amber · #ef4444 = red · #22c55e = green -->
<!-- Sources: plan §4 (design intent, S-01, S-02, S-03), §6.1.5 failsafe table, §9.2 row 1, §13.1; brief R11b (Q_TRANS_FAIL_ACT 0 = QLand, VERIFY); data/content.js failsafeTable; manual Flight Modes. -->
<defs><marker id="ah-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f0f0f"/></marker><marker id="ah-surf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker><marker id="ah-surf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="ah-border" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a2a2a"/></marker><marker id="ah-border2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ah-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8e8e8"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#facc15"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker><marker id="ah-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
<rect width="400" height="1216" fill="#1a1a1a"/>
<text x="14" y="28" font-size="17" fill="#f97316" font-weight="bold">D7 · CARRIER FAILSAFE</text>
<text x="14" y="50" fill="#777777">Fails safe ONLY on SIYI / GCS loss</text>
<rect x="18" y="70" width="364" height="166" rx="3" fill="#222222" stroke="#ef4444" stroke-width="2.5"/><text x="26" y="91" font-size="15" fill="#ef4444" font-weight="bold">SIYI / MP LINK LOST — PRIMARY</text><text x="26" y="110">Detect:  no GCS heartbeat 5 s</text><text x="26" y="129">         (FS_LONG_TIMEOUT), all modes</text><text x="26" y="148">         (FS_GCS_ENABL = 2)</text><text x="26" y="167" fill="#ef4444" font-weight="bold">Carrier: RTL (FS_LONG_ACTN = 1)</text><text x="26" y="186" fill="#facc15">         Q-mode RTL: TBD (SITL)</text><text x="26" y="205" fill="#777777">Pilot:   monitor; Nomad only</text><text x="26" y="224" fill="#777777">         if close range</text>
<rect x="18" y="246" width="364" height="147" rx="3" fill="#222222" stroke="#777777" stroke-width="1"/><text x="26" y="267" font-size="15" fill="#777777" font-weight="bold">915 MHz BACKUP LOST</text><text x="26" y="286">Detect:  ELRS RX failsafe</text><text x="26" y="305" font-weight="bold">Carrier: NONE — RC ignored</text><text x="26" y="324">         (THR_FAILSAFE = 2)</text><text x="26" y="343" fill="#777777">Pilot:   none beyond close range;</text><text x="26" y="362" fill="#777777">         close-in: take over in MP</text><text x="26" y="381" fill="#777777">         (QLOITER / QLAND)</text>
<rect x="18" y="403" width="364" height="109" rx="3" fill="#222222" stroke="#ef4444" stroke-width="1"/><text x="26" y="424" font-size="15" fill="#ef4444" font-weight="bold">BATTERY CRITICAL 22.2 V</text><text x="26" y="443">Detect:  BATT_CRT_VOLT</text><text x="26" y="462" font-weight="bold">Carrier: Loiter → QLand at the</text><text x="26" y="481">         current position</text><text x="26" y="500" fill="#777777">Pilot:   clear the area below</text>
<rect x="18" y="522" width="364" height="109" rx="3" fill="#222222" stroke="#facc15" stroke-width="1"/><text x="26" y="543" font-size="15" fill="#facc15" font-weight="bold">BATTERY LOW</text><text x="26" y="562">Detect:  BATT_LOW_VOLT = 0 (not set)</text><text x="26" y="581" font-weight="bold">Carrier: none</text><text x="26" y="600" fill="#777777">Pilot:   manual RTL at 23.0 V;</text><text x="26" y="619" fill="#777777">         RTL active before 22.5 V</text>
<rect x="18" y="641" width="364" height="147" rx="3" fill="#222222" stroke="#facc15" stroke-width="1"/><text x="26" y="662" font-size="15" fill="#facc15" font-weight="bold">TRANSITION FAIL</text><text x="26" y="681">Detect:  Q_TRANS_FAIL 4 s</text><text x="26" y="700" fill="#facc15" font-weight="bold">Carrier: QLand at the current</text><text x="26" y="719" fill="#facc15">         position (Q_TRANS_FAIL_ACT</text><text x="26" y="738" fill="#facc15">         = 0) — VERIFY firmware</text><text x="26" y="757" fill="#777777">Pilot:   no airspeed in 3 s →</text><text x="26" y="776" fill="#777777">         QHOVER before 4 s</text>
<text x="18" y="812" fill="#ef4444" font-weight="bold">SIYI-LOSS TIMELINE</text>
<circle cx="40" cy="840" r="6" fill="#222222" stroke="#ef4444" stroke-width="2"/>
<line x1="40" y1="846" x2="40" y2="935" stroke="#ef4444" stroke-width="2"/>
<text x="56" y="845" fill="#ef4444" font-weight="bold">0 s</text>
<text x="104" y="845">GCS heartbeat lost (MP closed,</text><text x="104" y="864">laptop asleep, cable, HM30).</text><text x="104" y="883">Client RC + video lost too →</text><text x="104" y="902">client fails safe; camera off.</text>
<circle cx="40" cy="949" r="6" fill="#ef4444" stroke="#ef4444" stroke-width="2"/>
<line x1="40" y1="955" x2="40" y2="1006" stroke="#ef4444" stroke-width="2"/>
<text x="56" y="954" fill="#ef4444" font-weight="bold">5 s</text>
<text x="104" y="954">RTL in any mode</text><text x="104" y="973">(FS_LONG_ACTN = 1).</text>
<circle cx="40" cy="1020" r="6" fill="#222222" stroke="#ef4444" stroke-width="2"/>
<line x1="40" y1="1026" x2="40" y2="1077" stroke="#ef4444" stroke-width="2"/>
<text x="56" y="1025" fill="#ef4444" font-weight="bold">→</text>
<text x="104" y="1025">climb to RTL_ALTITUDE 120 m</text><text x="104" y="1044">REL (above home), return.</text>
<circle cx="40" cy="1091" r="6" fill="#222222" stroke="#ef4444" stroke-width="2"/>
<text x="56" y="1096" fill="#ef4444" font-weight="bold">→</text>
<text x="104" y="1096">back-transition and land per</text><text x="104" y="1115" fill="#facc15">the Q settings — Q-mode RTL</text><text x="104" y="1134" fill="#facc15">behaviour: TBD (param file +</text><text x="104" y="1153" fill="#facc15">SITL test, S-02).</text>
<text x="18" y="1200" fill="#777777">Values: param file + default settings.</text>
</svg>
