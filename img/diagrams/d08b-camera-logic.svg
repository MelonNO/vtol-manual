,0 L10,5 L0,10 z" fill="#ef4444"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker><marker id="ah-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
<rect width="400" height="1049" fill="#1a1a1a"/>
<text x="14" y="28" font-size="17" fill="#f97316" font-weight="bold">D8b · CAMERA ON/OFF LOGIC</text>
<text x="14" y="50" fill="#777777">CAM_ENABLE → G0 → switch port P3</text>
<rect x="18" y="70" width="364" height="92" rx="3" fill="#222222" stroke="#facc15"/><text x="26" y="90" font-weight="bold">GCS app: camera request</text><text x="26" y="109">key k toggles; default OFF;</text><text x="26" y="128">refuses ON while the client is</text><text x="26" y="147">(or may be) armed — app default</text>
<polyline points="200,162 200,186" fill="none" stroke="#facc15" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-amber)"/>
<rect x="18" y="188" width="364" height="54" rx="3" fill="#222222" stroke="#facc15"/><text x="26" y="208" font-weight="bold">rc_up flags bit 0 = CAM_ENABLE</text><text x="26" y="227">in every packet, UDP 5770</text>
<polyline points="200,242 200,266" fill="none" stroke="#facc15" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-amber)"/>
<rect x="18" y="268" width="364" height="73" rx="3" fill="#222222" stroke="#facc15"/><text x="26" y="288" font-weight="bold">G0 bridge</text><text x="26" y="307">applies a change within one</text><text x="26" y="326">packet, via SPI to the switch</text>
<polyline points="200,341 200,365" fill="none" stroke="#facc15" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-amber)"/>
<rect x="18" y="367" width="364" height="149" rx="3" fill="#222222" stroke="#facc15"/><text x="26" y="387" font-weight="bold">Switch port P3</text><text x="26" y="406" fill="#22c55e">ON: P3 enabled, capped by the</text><text x="26" y="425" fill="#22c55e">    ingress limit (TBD, Q13)</text><text x="26" y="444" fill="#ef4444">OFF: P3 receive disabled or</text><text x="26" y="463" fill="#ef4444">    limit at minimum</text><text x="26" y="482">camera stays powered → resumes</text><text x="26" y="501">at once, no reboot</text>
<polyline points="200,516 200,540" fill="none" stroke="#22c55e" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-green)"/>
<rect x="18" y="542" width="364" height="73" rx="3" fill="#222222" stroke="#22c55e"/><text x="26" y="562" font-weight="bold">G0 reads the registers back</text><text x="26" y="581">status packet (10 Hz), flags bit 0</text><text x="26" y="600">= camera read-back (actual state)</text>
<polyline points="200,615 200,639" fill="none" stroke="#22c55e" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-green)"/>
<rect x="18" y="641" width="364" height="73" rx="3" fill="#222222" stroke="#22c55e"/><text x="26" y="661" font-weight="bold">App shows requested vs reported</text><text x="26" y="680">differ &gt; 1 s → CAMERA STATE</text><text x="26" y="699">MISMATCH (warn)</text>
<text x="18" y="734" font-weight="bold">RULES (current relay design)</text>
<text x="18" y="756">• power-up: OFF (default)</text><text x="18" y="775" fill="#ef4444">• GCS stream lost: forced OFF —</text><text x="18" y="794" fill="#ef4444">  re-enable once the stream is back</text><text x="18" y="813">• test 9: camera traffic on P1 stops</text><text x="18" y="832">  within one RC packet of OFF</text>
<rect x="18" y="865" width="364" height="164" rx="3" fill="#222222" stroke="#facc15" stroke-dasharray="6,4"/><text x="26" y="885" fill="#facc15" font-weight="bold">FIRMWARE REQUEST — not implemented</text><text x="26" y="904" fill="#777777">client-gated variant (owner Q12):</text>
<text x="28" y="931">no GCS stream since boot</text>
<text x="372" y="931" fill="#22c55e" text-anchor="end" font-weight="bold">ON (cap)</text>
<text x="28" y="959">RC stream running</text>
<text x="372" y="959" fill="#facc15" text-anchor="end" font-weight="bold">CAM_ENABLE</text>
<text x="28" y="987">stream lost after running</text>
<text x="372" y="987" fill="#ef4444" text-anchor="end" font-weight="bold">OFF</text>
<text x="28" y="1015">new stream after loss</text>
<text x="372" y="1015" fill="#facc15" text-anchor="end" font-weight="bold">CAM_ENABLE</text>
</svg>
