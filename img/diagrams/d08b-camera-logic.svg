<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1049" width="400" height="1049" role="img" aria-labelledby="title desc" font-family="'Share Tech Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="14" fill="#e8e8e8">
<title id="title">D8b — Camera on/off logic: CAM_ENABLE from the GCS app through the G0 bridge to switch port P3, with read-back</title>
<desc id="desc">The GCS app holds the camera request (key k, default OFF; with its default setting it refuses ON while the client is or may be armed). The request travels as bit 0 (CAM_ENABLE) of the rc_up flags in every packet to UDP 5770. The G0 applies a change within one packet over SPI to the switch. P3 ON: enabled and capped by its ingress rate limit (value TBD, Q13); OFF: receive disabled or limit at minimum. The camera stays powered and resumes at once. The G0 reads the switch registers back and reports the actual state in the 10 Hz status packet (flags bit 0); the app shows requested versus reported and raises CAMERA STATE MISMATCH after more than 1 s. Rules: OFF at power-up; forced OFF when the GCS stream is lost, re-enable once the stream is back; test 9: camera traffic on P1 stops within one RC packet. Firmware request, not implemented (owner decision Q12): no stream since boot → ON at its cap; stream running → follows CAM_ENABLE; stream lost after running → OFF; new stream → follows CAM_ENABLE.</desc>
