<text x="18" y="754" fill="#22c55e" font-weight="bold">Inner zone = worst case: covered at</text><text x="18" y="772" fill="#22c55e" font-weight="bold">every point of the orbit.</text><text x="18" y="790">Outer = best case: covered at some</text><text x="18" y="808">point only. Keep the client inside</text><text x="18" y="826">the inner zone and inside the orbit.</text><text x="18" y="844" fill="#facc15">Shapes illustrative — use the MAP</text><text x="18" y="862" fill="#facc15">for each site and client.</text>
