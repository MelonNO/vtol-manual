<circle cx="200" cy="586" r="62" fill="#22c55e" fill-opacity="0.35" stroke="#22c55e" stroke-width="2"/>
<circle cx="200" cy="586" r="90" fill="none" stroke="#e8e8e8" stroke-width="1.5" stroke-dasharray="3,4"/>
<polygon points="290,578 282,592 298,592" fill="#e8e8e8"/>
<text x="200" y="582" text-anchor="middle" font-weight="bold">ALWAYS</text>
