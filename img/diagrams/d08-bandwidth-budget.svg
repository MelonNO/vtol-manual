<text x="18" y="434" font-weight="bold">The HM30 radio is the bottleneck,</text><text x="18" y="453">not the 100 Mbit cable: switch</text><text x="18" y="472">priorities only order packets on</text><text x="18" y="491">the cable (RC → video → camera).</text><text x="18" y="510"></text><text x="18" y="529" fill="#facc15">Until measured: camera OFF while the</text><text x="18" y="548" fill="#facc15">client is armed. Test 9 must show</text><text x="18" y="567" fill="#facc15">FPV latency unchanged with the</text><text x="18" y="586" fill="#facc15">camera at its cap — if it fails:</text><text x="18" y="605" fill="#facc15">camera off whenever the client is</text><text x="18" y="624" fill="#facc15">airborne.</text>
