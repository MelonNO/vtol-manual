<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1168" width="400" height="1168" role="img" aria-labelledby="title desc" font-family="'Share Tech Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="14" fill="#e8e8e8">
<title id="title">D9 — Carrier antenna layout (schematic): VRX patch orientation, antenna list, co-site notes</title>
<desc id="desc">Schematic top and rear views of the Heewing T2 Cruza. The two VRX patches face the right wing: patch 1 boresight horizontal to the right (90° from up), patch 2 right and 45° down (135°), as modelled in the coverage map (cos^3.5 per patch); fly the orbit with the operating area on the right (clockwise seen from above). Antennas: HM30 air unit (GCS IP link, band TBD), VRX patches (client video, band per client), ELRS TX module (client RC, 868/915/2.4 GHz), ELRS RX 915 (carrier backup, close range), GPS. Mounting positions and separation distances: TBD from own annotated photos and relay-design test 7. Co-site: HM30, ELRS TX module and VRX share one airframe; test 7 result and the cleanest analog channel TBD; 25 MHz harmonics of the switch and W5500 land on 5800 MHz and near GPS L1, so keep GPS and VRX away from the relay PCB.</desc>
<!-- Palette: standalone SVG cannot read the page CSS variables, so it uses the same values as the :root tokens in css/base.css (muted: the manual value).
     Token names below are the CSS custom properties without their two leading dashes (XML comments may not contain a double dash):
     #0f0f0f = bg · #1a1a1a = surface · #222222 = surface2 · #333333 = border2 · #444444 = dim · #2a2a2a = border
     #e8e8e8 = text · #777777 = muted · #f97316 = accent · #facc15 = amber · #ef4444 = red · #22c55e = green -->
<!-- Sources: plan §9.3 D9, §6.1.3 item 6 (co-site), §8.1; relay/rfmodel.js PATCH_BORESIGHTS and PATCH_N; relay design &quot;PCB stackup and layout rules&quot;, test 7. -->
