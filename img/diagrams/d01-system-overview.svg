<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1282" width="400" height="1282" role="img" aria-labelledby="title desc" font-family="'Share Tech Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="14" fill="#e8e8e8">
<title id="title">D1 — System overview: ground station, carrier and client with all four links</title>
<desc id="desc">Windows laptop with the EdgeTX radio (USB joystick, RF off), the GCS companion app (rc_up on UDP 5770), Mission Planner (UDPCI 192.168.144.12:19856) and the video viewer (UDP 5601, MP HUD 5602), Ethernet to the HM30 ground unit on the mast. The HM30 IP link is the only GCS link and carries MAVLink, RC UDP, client video RTP and the camera stream. A 915 MHz Nomad is the carrier's close-range backup to an ELRS RX on the ArduPlane FC. On the carrier the HM30 air unit connects to the FC (MAVLink, not through the relay) and to switch port P1 of the relay PCB (KSZ8795): P2 net/RC board (W5500 + STM32G030) drives the ELRS TX module over CRSF, P5 video board (STM32N657) takes CVBS from the VRX, P3 the IP camera (gated by CAM_ENABLE), P4 spare. Client RC: ELRS 868/915/2.4 GHz or Gemini to the client ELRS RX and FC. Client video: analog VTX, band per client (5.8 GHz default), to the carrier VRX. HM30 band: TBD (link profile).</desc>
