<rect x="18" y="140" width="364" height="128" rx="3" fill="#1f1f1f" stroke="#333333"/><text x="26" y="162" font-weight="bold">Local (127.0.0.1) on the laptop:</text><text x="26" y="182" fill="#ef4444">app receives UDP 5600, re-sends:</text><text x="26" y="202" fill="#ef4444">  → 5601 standalone viewer</text><text x="26" y="222" fill="#ef4444">  → 5602 Mission Planner HUD</text><text x="26" y="242" fill="#a0a0a0">app API HTTP 47800 (read-only)</text>
