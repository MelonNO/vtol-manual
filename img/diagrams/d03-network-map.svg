<text x="208" y="384" font-weight="bold">HM30 IP link</text>
<rect x="18" y="402" width="364" height="40" rx="3" fill="#1f1f1f" stroke="#333333"/><text x="200" y="424.2" text-anchor="middle" font-weight="bold">HM30 air unit · 192.168.144.11</text>
<polyline points="200,442 200,462" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-text)" marker-start="url(#ah-text)"/>
<text x="208" y="458" font-weight="bold">P1</text>
<rect x="18" y="464" width="364" height="34" rx="2" fill="#1f1f1f" stroke="#333333"/><text x="200" y="483.2" text-anchor="middle" font-weight="bold">Relay switch (KSZ8795)</text>
<text x="18" y="514" fill="#a0a0a0">switch ports:</text>
<rect x="18" y="520" width="50" height="82" rx="3" fill="#1f1f1f" stroke="#ef4444"/><text x="43" y="563.2" fill="#ef4444" text-anchor="middle" font-weight="bold">P5</text>
<rect x="76" y="520" width="306" height="82" rx="3" fill="#1f1f1f" stroke="#ef4444"/><text x="84" y="540" font-weight="bold">N6 video board</text><text x="84" y="559" fill="#a0a0a0">IP TBD (e.g. .20)</text><text x="84" y="578" fill="#ef4444">RTP/UDP → 5600 at the GCS</text><text x="84" y="597" fill="#ef4444">carrier → GCS</text>
<rect x="18" y="614" width="50" height="120" rx="3" fill="#1f1f1f" stroke="#f97316"/><text x="43" y="676.2" fill="#f97316" text-anchor="middle" font-weight="bold">P2</text>
<rect x="76" y="614" width="306" height="120" rx="3" fill="#1f1f1f" stroke="#f97316"/><text x="84" y="634" font-weight="bold">RC bridge (W5500)</text><text x="84" y="653" fill="#a0a0a0">IP TBD (e.g. .21)</text><text x="84" y="672" fill="#f97316">UDP 5770 at the bridge:</text><text x="84" y="691" fill="#f97316">rc_up 36 B, 200–250 Hz ←</text><text x="84" y="710" fill="#f97316">→ status 10 Hz + CRSF telem.</text><text x="84" y="729" fill="#f97316">to the rc_up source IP:port</text>
<rect x="18" y="746" width="50" height="101" rx="3" fill="#1f1f1f" stroke="#facc15"/><text x="43" y="798.7" fill="#facc15" text-anchor="middle" font-weight="bold">P3</text>
<rect x="76" y="746" width="306" height="101" rx="3" fill="#1f1f1f" stroke="#facc15"/><text x="84" y="766" font-weight="bold">IP camera</text><text x="84" y="785" fill="#a0a0a0">.26 (current)</text><text x="84" y="804" fill="#facc15">RTSP 8554 /main.264 → GCS</text><text x="84" y="823" fill="#facc15">only while CAM_ENABLE = 1</text><text x="84" y="842" fill="#facc15">VLAN → P1 only, rate-limited</text>
<rect x="18" y="859" width="50" height="82" rx="3" fill="#1f1f1f" stroke="#a0a0a0"/><text x="43" y="902.2" fill="#a0a0a0" text-anchor="middle" font-weight="bold">P4</text>
