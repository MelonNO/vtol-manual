<text x="208" y="298" fill="#a0a0a0">Ethernet</text>
<rect x="18" y="306" width="364" height="52" rx="3" fill="#1f1f1f" stroke="#22c55e"/><text x="200" y="324.2" text-anchor="middle" font-weight="bold">HM30 ground unit · 192.168.144.12</text><text x="200" y="343.2" text-anchor="middle">UDP 19856 MAVLink ↔ MP UDPCI</text>
