<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1062" width="400" height="1062" role="img" aria-labelledby="title desc" font-family="'Share Tech Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="14" fill="#e8e8e8">
<title id="title">D11 — Carrier wiring harness: battery to FC/ESC, XT30 to the relay PCB, Ethernet runs, CRSF lead, CVBS lead</title>
<desc id="desc">The 6S 7000 mAh carrier battery powers every system: FC and ESCs (M1, M2 tilt, M4 tail), the HM30 air unit (supply per HM30 manual, TBD), the relay PCB through its XT30 (VIN 6–26 V), the IP camera (supply TBD) and the VRX (supply TBD). Signal runs: HM30 air unit Ethernet to relay P1; IP camera to P3 on JST-GH 4-pin TX+ TX− RX+ RX− (re-terminated, pairs twisted); spare P4 on JST-GH 4-pin; relay CRSF JST-GH 4-pin (VBAT_TX, GND, CRSF, spare) to the ELRS TX module — for the Nomad VBAT_TX must be within 6–16.8 V and above 250 mW it needs the XT30 supply (2S–4S), peak current TBD; VRX to the relay CVBS input on SMA or JST-GH 2-pin, never with goggles in parallel; HM30 air unit to the FC for MAVLink (not through the relay); ELRS RX 915 and GPS to the FC.</desc>
<!-- Palette: standalone SVG cannot read the page CSS variables, so it uses the same values as the :root tokens in css/base.css.
     Token names below are the CSS custom properties without their two leading dashes (XML comments may not contain a double dash):
     #0f0f0f = bg · #171717 = surface · #1f1f1f = surface2 · #333333 = border2 · #6e6e6e = dim · #262626 = border
     #e8e8e8 = text · #a0a0a0 = muted · #f97316 = accent · #facc15 = amber · #ef4444 = red · #22c55e = green -->
<!-- Sources: plan §9.3 D11, §3.4 item 4, §6.1.4 (connectors, power); relay design &quot;Connectors&quot;, &quot;CVBS input&quot;, &quot;Ethernet&quot;; manual Aircraft battery table, Relay tab connectors. -->
