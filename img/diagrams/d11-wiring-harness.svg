<rect width="400" height="1062" fill="#171717"/>
<text x="14" y="28" font-size="17" font-weight="bold">D11 · CARRIER WIRING HARNESS</text>
<text x="14" y="50" fill="#a0a0a0">Power taps and signal runs</text>
<rect x="18" y="72" width="364" height="50" rx="3" fill="#1f1f1f" stroke="#22c55e"/><text x="200" y="90.2" text-anchor="middle" font-weight="bold">Carrier battery 6S 7000 mAh</text><text x="200" y="108.2" text-anchor="middle">one pack powers every carrier system</text>
<text x="44" y="148" fill="#22c55e" font-weight="bold">POWER</text>
