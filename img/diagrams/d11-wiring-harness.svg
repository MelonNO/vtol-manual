<rect x="60" y="162" width="322" height="46" rx="3" fill="#1f1f1f" stroke="#e8e8e8"/><text x="68" y="181" font-weight="bold">FC + ESCs</text><text x="68" y="199" fill="#a0a0a0">M1 / M2 tilt, M4 tail</text>
<polyline points="34,238 58,238" fill="none" stroke="#22c55e" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-green)"/>
