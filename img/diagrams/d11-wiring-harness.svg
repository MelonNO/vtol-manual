<polyline points="34,346 58,346" fill="none" stroke="#22c55e" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-green)"/>
<rect x="60" y="324" width="322" height="46" rx="3" fill="#1f1f1f" stroke="#facc15"/><text x="68" y="343" font-weight="bold">IP camera</text><text x="68" y="361" fill="#facc15">supply: TBD</text>
<polyline points="34,400 58,400" fill="none" stroke="#22c55e" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-green)"/>
<rect x="60" y="378" width="322" height="46" rx="3" fill="#1f1f1f" stroke="#ef4444"/><text x="68" y="397" font-weight="bold">VRX</text><text x="68" y="415" fill="#facc15">supply: TBD</text>
<text x="18" y="448" fill="#a0a0a0" font-weight="bold">SIGNAL RUNS</text>
<rect x="18" y="460" width="364" height="66" rx="3" fill="#1f1f1f" stroke="#e8e8e8"/><text x="26" y="480" font-weight="bold">HM30 air ↔ relay P1</text><text x="26" y="498">Ethernet, HM30 connector</text><text x="26" y="516">(pinout per HM30 manual)</text>
<rect x="18" y="534" width="364" height="84" rx="3" fill="#1f1f1f" stroke="#facc15"/><text x="26" y="554" fill="#facc15" font-weight="bold">IP camera ↔ relay P3</text><text x="26" y="572">JST-GH 4-pin TX+ TX− RX+ RX−:</text><text x="26" y="590">re-terminate the camera cable,</text><text x="26" y="608">keep the pairs twisted</text>
<rect x="18" y="626" width="364" height="48" rx="3" fill="#1f1f1f" stroke="#a0a0a0"/><text x="26" y="646" fill="#a0a0a0" font-weight="bold">Spare ↔ relay P4</text><text x="26" y="664">JST-GH 4-pin TX+ TX− RX+ RX−</text>
<rect x="18" y="682" width="364" height="102" rx="3" fill="#1f1f1f" stroke="#f97316"/><text x="26" y="702" fill="#f97316" font-weight="bold">Relay CRSF → ELRS TX module</text><text x="26" y="720">JST-GH 4-pin VBAT_TX, GND, CRSF,</text><text x="26" y="738">spare. Nomad: VBAT_TX inside</text><text x="26" y="756">6–16.8 V; &gt; 250 mW needs XT30</text><text x="26" y="774" fill="#facc15">supply (2S–4S). Peak A: TBD</text>
<rect x="18" y="792" width="364" height="84" rx="3" fill="#1f1f1f" stroke="#ef4444"/><text x="26" y="812" fill="#ef4444" font-weight="bold">VRX → relay CVBS in</text><text x="26" y="830">SMA or JST-GH 2-pin. Never</text><text x="26" y="848">goggles in parallel on one VRX</text><text x="26" y="866">output (input is terminated)</text>
<rect x="18" y="884" width="364" height="66" rx="3" fill="#1f1f1f" stroke="#22c55e"/><text x="26" y="904" fill="#22c55e" font-weight="bold">HM30 air ↔ FC</text><text x="26" y="922">MAVLink (carrier control,</text><text x="26" y="940">not through the relay)</text>
<rect x="18" y="958" width="364" height="48" rx="3" fill="#1f1f1f" stroke="#a0a0a0"/><text x="26" y="978" fill="#a0a0a0" font-weight="bold">ELRS RX 915 → FC · GPS → FC</text><text x="26" y="996">carrier backup RC, navigation</text>
<text x="18" y="1028" fill="#a0a0a0">Lock every JST-GH; check leads at</text>
