<text x="374" y="811" fill="#facc15" text-anchor="end" font-weight="bold">TBD — test 6</text>
<rect x="18" y="823" width="364" height="26" fill="#222222" stroke="#333333"/>
<text x="26" y="841">controller unplugged</text>
<text x="374" y="841" fill="#facc15" text-anchor="end" font-weight="bold">TBD — test 6</text>
<rect x="18" y="853" width="364" height="26" fill="#222222" stroke="#333333"/>
<text x="26" y="871">HM30 unplugged / lost</text>
<text x="374" y="871" fill="#facc15" text-anchor="end" font-weight="bold">TBD — test 6</text>
<rect x="18" y="883" width="364" height="26" fill="#222222" stroke="#333333"/>
<text x="26" y="901">G0 reset</text>
<text x="374" y="901" fill="#facc15" text-anchor="end" font-weight="bold">TBD — test 6</text>
<text x="18" y="935" fill="#777777">Only T_hold is designed; measure the</text><text x="18" y="953" fill="#777777">total per cause (relay-design test 6).</text><text x="18" y="971">HM30 loss: after 5 s the carrier also</text><text x="18" y="989">RTLs (FW) / QRTLs (VTOL); camera off.</text><text x="18" y="1007" fill="#777777">No default sticks at boot: 5 valid</text><text x="18" y="1025" fill="#777777">packets before any CRSF.</text>
