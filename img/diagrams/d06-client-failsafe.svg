<polyline points="200,298 200,322" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-text)"/>
<rect x="18" y="324" width="364" height="73" rx="3" fill="#222222" stroke="#facc15"/><text x="26" y="344" font-weight="bold">ELRS TX module reacts to the</text><text x="26" y="363">silent handset (stops sending)</text><text x="26" y="382" fill="#facc15" font-weight="bold">TBD — measure (test 6)</text>
<polyline points="200,397 200,421" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-text)"/>
<rect x="18" y="423" width="364" height="73" rx="3" fill="#222222" stroke="#facc15"/><text x="26" y="443" font-weight="bold">Client RX failsafe</text><text x="26" y="462">no packets from the module</text><text x="26" y="481" fill="#facc15" font-weight="bold">RX timeout: TBD per client</text>
<polyline points="200,496 200,520" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-text)"/>
<rect x="18" y="522" width="364" height="111" rx="3" fill="#222222" stroke="#f97316"/><text x="26" y="542" font-weight="bold">Client FC failsafe (per profile)</text><text x="26" y="561">e.g. Betaflight stage 1 → GPS</text><text x="26" y="580">Rescue. Reference client #1:</text><text x="26" y="599">delay 2.5 s (1.5 s + 1 s)</text><text x="26" y="618" fill="#f97316" font-weight="bold">profile: failsafe delay</text>
<polyline points="200,633 200,657" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-text)"/>
