[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vtolgcs"
version = "0.1.0"
description = "Windows GCS companion app for the vtol-manual relay (protocol layer, WP03)"
requires-python = ">=3.12"
dependencies = []   # the protocol, CRSF and simulator modules use the standard library only

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["vtolgcs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
