# CI for the web suite and the GCS companion app (WP10 R1, R10b, R10c).
# Runs on every push and pull request. No build step: the pages are served as they are committed.
# Node packages (jsdom, html-validate) are installed in CI only, outside the repository: the repo has no
# package.json and no node_modules.
#
# Action versions (WP17 R8): the current majors, all `runs.using: node24` (GitHub deprecated the Node 20 runtime
# of the older majors). Checked on 2026-10-17 on the release pages and in each tag's action.yml:
#   actions/checkout@v7        https://github.com/actions/checkout/releases          (v7.0.1 latest)
#   actions/setup-node@v7      https://github.com/actions/setup-node/releases        (v7.1.0 latest)
#   actions/setup-python@v7    https://github.com/actions/setup-python/releases      (v7.0.0 latest)
#   actions/upload-artifact@v7 https://github.com/actions/upload-artifact/releases   (v7.0.2 latest)
# Runner images are pinned (WP17 R8): ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19 (GitHub changelog
# 2026-09-17); windows-2025 is what windows-latest is today (actions/runner-images README). Moving to a newer
# image is a deliberate change, tested on its own.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'          # the version the tests are written for (node --test test/ resolves test/index.js)
  PYTHON_VERSION: '3.12'      # the GCS app pins Python 3.12 (gcs/pyproject.toml)
  JSDOM_VERSION: '30.1.3'
  HTML_VALIDATE_VERSION: '11.16.2'

jobs:
  web:
    name: Web pages — tests, jsdom smoke, html-validate, links, images, colours, generated files
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generated files are up to date (precache list, diagrams, parameter reference)
        run: |
          node scripts/gen-precache.mjs --check
          node scripts/diagrams/build.js --check
          node scripts/gen-params-reference.mjs --check

      - name: Unit tests without jsdom (the jsdom-only tests report as skipped)
        run: node --test test/

      - name: Install the CI-only tools outside the repository
        run: >
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/ci-tools"
          "jsdom@$JSDOM_VERSION" "html-validate@$HTML_VALIDATE_VERSION"

      - name: All unit tests with jsdom, including the page smoke tests (test/smoke/)
        # shell: bash = `bash --noprofile --norc -eo pipefail`; GitHub's default (`bash -e`) has no pipefail, so a
        # failing `node --test … | tee` would return tee's status 0 (WP10 verification F1). The script also sets
        # pipefail itself and checks the reported fail count, so it fails under either shell.
        # Proven by test/ci/workflows.test.js, which runs this script on a tree with a failing test.
        shell: bash
        env:
          VTOL_JSDOM: ${{ runner.temp }}/ci-tools/node_modules/jsdom
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/node-test.txt"
          node --test test/ 2>&1 | tee "$log"
          # a reported failure fails the step even if an exit status were lost
          if grep -Eq '^# fail [1-9]|^ℹ fail [1-9]' "$log"; then
            echo "::error::node --test reported failing tests"; exit 1
          fi
          # with jsdom installed, no test may be skipped (R10c: the jsdom-gated tests really run in CI)
          if grep -Eq '^# skipped [1-9]|^ℹ skipped [1-9]' "$log"; then
            echo "::error::tests were skipped although jsdom is installed"; exit 1
          fi

      - name: html-validate (accepted rules and their reasons are in .htmlvalidate.cjs)
        run: >
          "$RUNNER_TEMP/ci-tools/node_modules/.bin/html-validate"
          index.html manual.html relay/map.html tools/latency-clock.html

      - name: Internal links and assets
        run: node scripts/check-links.mjs

      - name: Image-size budget (raster ≤ 250 KiB, diagrams ≤ 60 KiB)
        run: node scripts/check-images.mjs

      - name: No hard-coded colours in inline SVG or inline styles
        run: node scripts/check-colours.mjs

  python-portable:
    name: Python — protocol and CRSF reference (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install pytest
      - name: Protocol and CRSF tests (platform-neutral; the full suite runs on Windows below)
        timeout-minutes: 5
        env:
          PYTHONUNBUFFERED: '1'
        run: python -u -m pytest gcs/tests/test_protocol.py gcs/tests/test_crsf.py -v -p no:cacheprovider -rfEs --durations=5
      - name: Test vectors up to date, protocol self-test
        run: |
          python gcs/tools/gen_test_vectors.py --check
          cd gcs && python -m vtolgcs.protocol --selftest

  python-windows:
    name: Python — full GCS suite ×5 (Windows)
    # The GCS app is Windows-only: named pipes, consoles, waitable timers and tkinter are exercised for real here.
    # Tests marked interactive_desktop (real console input, Ctrl+C delivery, foreground window, SDL) skip themselves
    # on a runner (GITHUB_ACTIONS=true; gcs/conftest.py); they run on a desktop before each release
    # (docs/relay/OPEN-ITEMS.md). Every test has a hard timeout with a stack dump (gcs/conftest.py, WP17).
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install pytest pygame-ce
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The piped test steps of this workflow fail on a failing test (test/ci/workflows.test.js)
        timeout-minutes: 5
        # Runs the jsdom step (Git Bash, `bash -e`) and the pytest loop below (PowerShell) verbatim on throw-away
        # trees with failing and passing tests. Here every check must run: an unavailable tool fails the step.
        env:
          VTOL_REQUIRE_WORKFLOW_TEST: '1'
          VTOL_PYTHON: python
        run: node --test test/ci/workflows.test.js
      - name: pytest gcs protocol, five consecutive runs (R10b — timing-sensitive tests must not flake)
        # Every run keeps its FULL output (long tracebacks, the slowest tests, and the short summary naming each
        # failing test) in pytest-logs/run-N.txt, uploaded below whatever the result, so a rare failure is never
        # reduced to a count. All five runs always execute; the step fails if any of them failed (pytest's exit code
        # OR a "N failed" / "N error" summary line). Annotations: GitHub shows at most 10 per step, so each distinct
        # failing test id comes first (once, with its runs; 7, then all the others in one line), then one summary
        # line. WP18: the ids come from the conftest's "+++ FAILED|ERROR [time] <id> (<phase>)" lines, written when
        # the test fails (they survive a session that dies later; the full text is in pytest-failures.txt), else
        # from pytest's summary lines ("FAILED gcs/…::test"); never from captured log lines ("ERROR    vtolgcs.…").
        # A test that hangs is named live (-v, unbuffered, a START line per test), dumped and failed by the per-test
        # watchdog ("+++ TIMEOUT [time] <id>", also annotated); dumps also go to pytest-logs/pytest-timeouts.txt.
        # A hang with the GIL held ends the run through faulthandler ("Timeout (h:mm:ss)!" + stacks, exit 1): the
        # annotated id is the last START line before it; after "END of session" (or "+++ EXIT GUARD/WATCHDOG")
        # it is a hang at interpreter exit (gcs/conftest.py lists what each guard covers).
        # The step timeout (35 min) is below the job timeout (45 min), so the logs are uploaded even after a hang.
        # Proven by test/ci/workflows.test.js (runs this script on trees with failing / passing / hanging tests).
        shell: pwsh
        timeout-minutes: 35
        env:
          PYTHONUNBUFFERED: '1'
          VTOLGCS_TEST_DUMP_DIR: pytest-logs
        run: |
          New-Item -ItemType Directory -Force pytest-logs | Out-Null
          $failed = @()
          $tests = [ordered]@{}
          for ($i = 1; $i -le 5; $i++) {
            Write-Host "::group::pytest run $i of 5"
            python -u -m pytest gcs protocol -v -p no:cacheprovider -rfEs --tb=long --durations=10 2>&1 |
              Tee-Object -FilePath "pytest-logs/run-$i.txt"
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            $summary = Select-String -Path "pytest-logs/run-$i.txt" -Pattern '^=+ .*\b\d+ (failed|errors?)\b'
            if ($code -ne 0 -or $summary) {
              $failed += $i
              $log = "pytest-logs/run-$i.txt"
              $found = @(Select-String -CaseSensitive -Path $log -Pattern '^\+\+\+ (FAILED|ERROR) \[[0-9:]+\] (.+) \((setup|call|teardown|collect)\)$' | ForEach-Object { $_.Matches[0].Groups[2].Value })
              if (-not $found.Count) { $found = @(Select-String -CaseSensitive -Path $log -Pattern '^(FAILED|ERROR) (\S+)' | ForEach-Object { $_.Matches[0].Groups[2].Value }) }
              $found += @(Select-String -CaseSensitive -Path $log -Pattern '^\+\+\+ TIMEOUT \[[0-9:]+\] (.+) still running after' | ForEach-Object { $_.Matches[0].Groups[1].Value })
              $hang = Select-String -CaseSensitive -Path $log -Pattern 'Timeout \([0-9:.]+\)!|^\+\+\+ EXIT (GUARD|WATCHDOG)' | Select-Object -First 1
              if ($hang) {
                $last = Select-String -CaseSensitive -Path $log -Pattern '^\[[0-9:]+\] (START (\S.*)|END of session)' |
                  Where-Object { $_.LineNumber -lt $hang.LineNumber } | Select-Object -Last 1
                $found += $(if ($last -and $last.Matches[0].Groups[2].Success) { $last.Matches[0].Groups[2].Value } else { '(hang at interpreter exit)' })
              }
              foreach ($id in $found) {
                $id = $id -replace '\\', '/'
                if (-not $tests.Contains($id)) { $tests[$id] = @() }
                if (-not (@($tests[$id]) -contains $i)) { $tests[$id] = @($tests[$id]) + $i }
              }
            }
          }
          if ($failed.Count) {
            $n = 0
            foreach ($id in $tests.Keys) {
              if ($n -lt 7) { Write-Host "::error::$id failed in run(s) $($tests[$id] -join ', ') of 5" }
              $n++
            }
            if ($n -gt 7) { Write-Host "::error::$($n - 7) more failed test(s): $((@($tests.Keys) | Select-Object -Skip 7 | ForEach-Object { "$_ (run(s) $($tests[$_] -join ', '))" }) -join ', ')" }
            Write-Host "::error::pytest failed in run(s) $($failed -join ', ') of 5 ($($tests.Count) distinct failing test id(s)); full logs: artifact pytest-logs-windows"
            exit 1
          }

      - name: Keep the full pytest logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-logs-windows
          path: pytest-logs/
          retention-days: 30
